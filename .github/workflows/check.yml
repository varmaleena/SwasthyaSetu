name: Local integrity and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env: {POSTGRES_USER: demo, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://demo:ci-only-password@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
# No deployment, paid services, credentials or auto-upgrade operations.
